# Render.com deployment configuration for TeleStore Worker
# This configuration is optimized for large file uploads (up to 2GB)

services:
  - type: web
    name: telestore-worker
    env: python
    runtime: python
    plan: free  # or upgrade to 'starter' for better performance
    
    # Build settings
    buildCommand: pip install -r requirements.txt
    
    # Start command with gunicorn config for large file timeouts
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    
    # Environment variables
    envVars:
      - key: BACKEND_URL
        value: https://teledrive-hhh9.onrender.com  # Replace with your TeleStore backend URL
      
      # Optional: Python version
      - key: PYTHON_VERSION
        value: 3.11.0
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Autoscaling (optional, requires paid plan)
    # autoDeploy: true
    # numInstances: 1
